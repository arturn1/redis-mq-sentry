global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: bull-board-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - bull-board-app:4000

  - job_name: orders-api-dotnet
    metrics_path: /metrics
    static_configs:
      - targets:
          - orders-api-dotnet:8080
        labels:
          service: orders-api
          lang: dotnet
