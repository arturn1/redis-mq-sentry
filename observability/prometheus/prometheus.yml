global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: bull-board-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - bull-board-app:4000

  - job_name: orders-api-dotnet
    metrics_path: /metrics
    static_configs:
      - targets:
          - orders-api-dotnet:8080
        labels:
          service: orders-api
          lang: dotnet


  - job_name: consumer-redis-orders
    metrics_path: /metrics
    static_configs:
      - targets:
          - consumer-redis-orders:9100
        labels:
          service: consumer-redis-orders
          type: consumer

  - job_name: consumer-redis-batch-orders
    metrics_path: /metrics
    static_configs:
      - targets:
          - consumer-redis-batch-orders:9100
        labels:
          service: consumer-redis-batch-orders
          type: consumer

  - job_name: consumer-rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - consumer-rabbitmq:9100
        labels:
          service: consumer-rabbitmq
          type: consumer
